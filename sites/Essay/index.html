<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASI-Discoveries Articles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">

    <!-- Minimal Top Bar -->
    <header class="top-bar">
        <div class="nav-group">
            <button id="btn-home" class="nav-btn" onclick="app.goHome()">HOME</button>
            <a href="about.html" class="nav-btn">ABOUT</a>
        </div>
    </header>

    <!-- Welcome Screen (Shows on every refresh) -->
    <section id="welcome-screen" class="fullscreen-section">
        <div class="welcome-content">
            <h1 class="welcome-title">Welcome</h1>
            <p class="welcome-sub">This is my personal space where I upload my Essay</p>
            <button id="enter-btn" class="glass-btn">Essay</button>
        </div>
    </section>

    <!-- Main Article Container -->
    <main id="main-hub" class="hub-container hidden">
        <div class="grid-layout" id="article-grid">
            <!-- Articles injected here by app.js -->
        </div>
    </main>

    <!-- STUDENT WARNING BADGE -->
    <div class="student-warning">
        Contents may contain errors. Verify first.
    </div>

    <!-- Footer -->
    <footer class="main-footer">
        <p>&copy; 2026 WASI-Discoveries. ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
